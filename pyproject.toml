[build-system]
requires = [
    "setuptools >= 65",
    "setuptools_scm[toml] >6.2",
    "wheel >= 0.38.1",
]
build-backend = 'setuptools.build_meta'

[tool.setuptools_scm]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The CLI installs warning filters before importing the client.
"cli.py" = ["E402"]

[tool.pyright]
include = ["cli.py", "weaviate_cli", "test"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
